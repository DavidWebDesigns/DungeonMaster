name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tipos
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Formato
        run: pnpm format:check
      - name: Datos del juego
        run: pnpm validate-data
      - name: Pruebas
        run: pnpm test
      - name: Compilar el cliente
        run: pnpm --filter @dm/client build
